name: Fetch News & Deploy

on:
  schedule:
    # 北京时间 6:00, 10:00, 14:00, 18:00, 22:00, 2:00
    # UTC = 北京时间 - 8
    - cron: '0 22 * * *'   # 6:00 BJT
    - cron: '0 2  * * *'   # 10:00 BJT
    - cron: '0 6  * * *'   # 14:00 BJT
    - cron: '0 10 * * *'   # 18:00 BJT
    - cron: '0 14 * * *'   # 22:00 BJT
    - cron: '0 18 * * *'   # 2:00 BJT
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: node scripts/fetch-news.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: 'Update news [skip ci]'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
